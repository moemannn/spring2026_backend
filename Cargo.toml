[package]
name = "spring2026"
version = "0.1.0"
edition = "2021"

[workspace]
members = [".", "migration", "seeder", "seeder"]

[dependencies]
axum = "0.7"
axum-streams = { version = "0.23", features=["json", "csv", "protobuf", "text", "arrow"] }

tokio = { version = "1", features = ["full"] }

sea-orm = { version = "=2.0.0-rc.38", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "debug-print"
] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

dotenvy = "0.15"

# DEBUG
utoipa = { version = "5", features = ["macros", "axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "8", features = ["axum"] }
chrono = "0.4.44"
uuid = { version = "1.23.1", features = ["v4"] }
http = "1.4.0"
tower = "0.5.3"
tower-http = { version = "0.6.10", features = ["request-id", "trace"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
state = "0.6.0"
bcrypt = "0.19.1"
