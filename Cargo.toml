[package]
name = "axum_seaorm_postgres"
version = "0.1.0"
edition = "2021"

[workspace]
members = [
    ".",
    "migration"
]

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }

sea-orm = { version = "=2.0.0-rc.38", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "debug-print"
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

dotenvy = "0.15"

# DEBUG
utoipa = { version = "5", features = ["macros", "axum_extras"] }
utoipa-swagger-ui = { version = "8", features = ["axum"] }
chrono = "0.4.44"