name: Rust CI/CD (Windows Self-hosted)

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            C:\Users\${{ env.USERNAME }}\.cargo\registry
            C:\Users\${{ env.USERNAME }}\.cargo\git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        shell: pwsh
        run: cargo fmt -- --check

      - name: Clippy (lint)
        shell: pwsh
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        shell: pwsh
        run: cargo build --verbose

      - name: Test
        shell: pwsh
        run: cargo test --verbose


  release:
    runs-on: self-hosted
    needs: ci
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build release
        shell: pwsh
        run: cargo build --release

      - name: Get binary name
        id: bin
        shell: pwsh
        run: |
          $name = (Get-Content Cargo.toml | Select-String 'name =').ToString().Split('"')[1]
          echo "name=$name.exe" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-binary
          path: target/release/${{ steps.bin.outputs.name }}
