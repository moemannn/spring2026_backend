name: Rust CI/CD (Matrix Build)

on:
  push:
    branches: ["main", "dev"]
    tags:
      - "v*"
  pull_request:
    branches: ["main", "dev"]

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------------- Rust install ----------------
      - name: Install Rust - Windows
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          if (!(Get-Command rustc -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
            Start-Process .\rustup-init.exe -ArgumentList "-y" -Wait
          }

      - name: Install Rust - Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Add Rust to PATH - Linux
        if: matrix.os == 'ubuntu-latest'
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install components
        run: rustup component add rustfmt clippy

      # ---------------- Cache ----------------
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # ---------------- DEV ----------------
      - name: Format check (dev)
        if: github.ref == 'refs/heads/dev'
        run: cargo fmt -- --check || true

      - name: Clippy (dev soft)
        if: github.ref == 'refs/heads/dev'
        run: cargo clippy --all-targets --all-features -- -A warnings || true

      # ---------------- MAIN ----------------
      - name: Format check (main)
        if: github.ref == 'refs/heads/main'
        run: cargo fmt -- --check

      - name: Clippy (main strict)
        if: github.ref == 'refs/heads/main'
        run: cargo clippy --all-targets --all-features -- -D warnings

      # ---------------- Build and test ----------------
      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose


  release:
    runs-on: windows-latest
    needs: ci
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - name: Build release
        run: cargo build --release

      - name: Get binary name
        id: bin
        shell: powershell
        run: |
          $name = (Get-Content Cargo.toml | Select-String 'name =').ToString().Split('"')[1]
          echo "name=$name.exe" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-binary
          path: target/release/${{ steps.bin.outputs.name }}